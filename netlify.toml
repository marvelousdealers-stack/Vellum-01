[build]
  command = "npm run build"
  publish = "dist"

# SPA fallback — every unknown route serves index.html.
# Without this, refreshing on /teacher/drafts or any deep link
# returns Netlify's 404 instead of your app.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[build.environment]
  NODE_VERSION = "22"