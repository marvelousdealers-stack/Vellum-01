<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Vellum</title>
    <meta
      name="description"
      content="Vellum — build tests from your course material, grade against a rubric, and show every student where they stand."
    />
    <meta name="application-name" content="Vellum" />
    <meta name="apple-mobile-web-app-title" content="Vellum" />
    <meta name="color-scheme" content="light" />

    <!-- Icons: SVG for modern browsers, ICO fallback, 180px touch icon for iOS,
         manifest (192 / 512 / maskable) for Android + installable app.
         "?v=2" busts browser favicon caches after the rebrand. -->
    <link rel="icon" href="/favicon.svg?v=2" type="image/svg+xml" />
    <link rel="icon" href="/favicon.ico?v=2" sizes="32x32" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=2" />
    <link rel="manifest" href="/site.webmanifest?v=2" />

    <!-- Browser chrome tint. Light is the default theme; useTheme updates this
         if the user switches to dark. -->
    <meta name="theme-color" content="#F7F6F2" />

    <!-- Apply the saved theme before first paint (no flash). Light unless the
         user explicitly chose dark; the OS preference is intentionally ignored. -->
    <script>
      (function () {
        var t = "light";
        try {
          var s = JSON.parse(localStorage.getItem("vellum.theme"));
          if (s === "dark") t = "dark";
        } catch (e) {}
        var r = document.documentElement;
        r.setAttribute("data-theme", t);
        r.classList.add(t);
        if (t === "dark") document.querySelector('meta[name="theme-color"]').setAttribute("content", "#0A0D1B");
      })();
    </script>

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Vellum" />
    <meta property="og:title" content="Vellum — assessment, from outline to insight" />
    <meta
      property="og:description"
      content="Build tests from your course material, grade against a rubric, and show every student where they stand."
    />
    <meta name="twitter:card" content="summary" />

    <!-- Fonts: loaded here (not via CSS @import) so the request starts with the
         HTML instead of waiting on the stylesheet. Plus Jakarta Sans = UI,
         Fraunces = page titles + wordmark. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500..700&family=Plus+Jakarta+Sans:wght@400..800&display=swap"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
